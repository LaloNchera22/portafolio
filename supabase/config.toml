# Runinback — Supabase project config (for the Supabase CLI).
# `project_id` is just the local ref; it is not a secret.
project_id = "runinback"

[auth]
enable_signup = true
# Require a confirmed email before the account is usable.
enable_confirmations = true

[auth.email]
enable_signup = true
# An email change must be confirmed from both the old and the new address.
double_confirm_changes = true
# Changing the password needs a recent sign-in (the console re-checks the
# current password right before it asks, which counts).
secure_password_change = true
# steam-auth is the Steam login ENTRY point — it runs before any session exists,
# so it must be public. It does its own verification against Steam.
[functions.steam-auth]
verify_jwt = false

# stripe-checkout creates a Checkout session for the signed-in buyer. It needs a
# user JWT (the platform verifies it, then the function calls getUser() too).
[functions.stripe-checkout]
verify_jwt = true

# stripe-webhook is called by STRIPE, not by a user, so it must be public. Its
# authentication is the Stripe signature check inside the function — it credits
# nothing until that passes.
[functions.stripe-webhook]
verify_jwt = false

# Closes the caller's account (user JWT required).
[functions.close-account]
verify_jwt = true

# Scheduled health check; authenticated by the x-ops-secret header.
[functions.ops-alerts]
verify_jwt = false
