<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — Runinback</title>
  <meta name="description" content="Create your Runinback account and start staking skill-based matches in minutes." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0e100f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-auth-scope="signup">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav is-scrolled" data-nav>
    <div class="shell nav__inner">
      <a href="index.html" class="brand" aria-label="Runinback home">
        <img class="brand__icon" src="logo-icon.png" width="34" height="24" alt="" />
        <img class="brand__word" src="logo-word.png" width="64" height="14" alt="" />
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="how-it-works.html" class="nav__link">How it works</a>
        <a href="developers.html" class="nav__link">Developers</a>
        <span class="nav__account" id="nav-account">
          <a class="nav__link nav__auth" href="login.html">Log in</a>
          <a class="btn btn--cta btn--sm" href="signup.html">Sign up</a>
        </span>
      </nav>
      <button class="nav__toggle" data-nav-toggle aria-label="Toggle menu" aria-expanded="false"><span></span></button>
    </div>
  </header>

  <main id="main">
    <section class="auth-page">
      <div class="auth-card">
        <p class="eyebrow">Runinback account</p>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-sub muted">Start staking skill-based matches in minutes.</p>

        <div class="auth-social">
          <button type="button" class="auth-oauth" data-oauth="google" aria-label="Sign up with Google">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 10.2v3.9h5.5c-.2 1.4-1.6 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C17.1 3.5 14.8 2.5 12 2.5 6.8 2.5 2.6 6.7 2.6 12S6.8 21.5 12 21.5c6 0 9.9-4.2 9.9-10.1 0-.7-.1-1.2-.2-1.7H12z"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="auth-oauth" data-oauth="github" aria-label="Sign up with GitHub">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.4 9.4 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.59.69.49A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
            <span>GitHub</span>
          </button>
          <button type="button" class="auth-oauth" data-oauth="apple" aria-label="Sign up with Apple">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.36 12.9c-.02-2.2 1.8-3.25 1.88-3.3-1.02-1.5-2.62-1.7-3.18-1.72-1.35-.14-2.64.8-3.32.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.85-3.59 2.17-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.25 2.74 2.2 1.1-.04 1.52-.71 2.85-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.08 2.65-2.14.84-1.23 1.18-2.42 1.2-2.48-.03-.01-2.3-.88-2.32-3.5zM14.19 6.3c.6-.73 1.01-1.75.9-2.76-.87.03-1.92.58-2.55 1.3-.56.64-1.05 1.67-.92 2.65.97.08 1.96-.49 2.57-1.19z"/></svg>
            <span>Apple</span>
          </button>
          <button type="button" class="auth-oauth" data-oauth="steam" aria-label="Sign up with Steam">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.98 2C6.7 2 2.4 6.03 2 11.15l5.36 2.2a2.82 2.82 0 0 1 1.6-.49l2.39-3.45v-.05a3.77 3.77 0 1 1 3.77 3.77h-.09l-3.4 2.42v.1a2.83 2.83 0 0 1-5.62.42L2.2 14a10 10 0 1 0 9.78-12zm-3.6 15.18l-1.23-.5a2.13 2.13 0 0 0 3.94-1.6 2.13 2.13 0 0 0-2.9-1.98l1.27.52a1.57 1.57 0 1 1-1.08 2.95zM17.5 9.13a2.51 2.51 0 1 0-5.02 0 2.51 2.51 0 0 0 5.02 0zm-4.39 0a1.88 1.88 0 1 1 3.76 0 1.88 1.88 0 0 1-3.76 0z"/></svg>
            <span>Steam</span>
          </button>
        </div>
        <div class="auth-divider"><span>or sign up with email</span></div>

        <form class="form auth-form" id="signup-form" novalidate>
          <div class="field">
            <label>Account type</label>
            <div class="segmented" role="radiogroup" aria-label="Account type">
              <label class="seg"><input type="radio" name="role" value="player" checked /><span>Player</span></label>
              <label class="seg"><input type="radio" name="role" value="dev" /><span>Developer</span></label>
            </div>
          </div>
          <div class="field">
            <label for="signup-username">Username</label>
            <input id="signup-username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]+" placeholder="runback_ace" />
          </div>
          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" required placeholder="you@studio.gg" />
          </div>
          <div class="field">
            <div class="field__labelrow">
              <label for="signup-password">Password</label>
              <button type="button" class="pw-toggle" data-toggle-pw="signup-password" aria-pressed="false">Show</button>
            </div>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
            <div class="pw-meter"><span id="pw-strength"></span></div>
            <p class="pw-hint muted">Strength: <span id="pw-strength-label">—</span></p>
          </div>
          <div class="field">
            <div class="field__labelrow">
              <label for="signup-confirm">Confirm password</label>
              <button type="button" class="pw-toggle" data-toggle-pw="signup-confirm" aria-pressed="false">Show</button>
            </div>
            <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" placeholder="Repeat your password" />
          </div>
          <label class="checkbox"><input type="checkbox" id="signup-terms" required /><span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>

          <p class="auth-error" id="signup-error" role="alert" hidden></p>
          <p class="auth-note" id="signup-note" role="status" hidden></p>

          <button type="submit" class="btn btn--cta auth-submit" id="signup-submit">Create account</button>
        </form>

        <p class="auth-switch"><span>Already have an account?</span><a class="text-link" href="login.html">Log in</a></p>
        <p class="auth-fineprint muted">Non-custodial by design — Runinback never holds your funds or your keys.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
